[package]
name = "sanstun"
description = "A fast, sans-IO implementation of the WireGuard® protocol"
version = "0.1.0"
authors = ["Firezone, Inc."]
license = "BSD-3-Clause"
repository = "https://github.com/firezone/sanstun"
edition = "2021"
rust-version = "1.89"

[dependencies]
parking_lot = "0.12"
portable-atomic = { version = "1.13.1", features = ["fallback"] }
tracing = "0.1.44"
ring = "0.17"
x25519-dalek = { version = "3.0.0", features = [
    "reusable_secrets",
    "static_secrets",
    "getrandom",
] }
rand = "0.10"
chacha20poly1305 = "0.10.1"
aead = "0.5.2"
blake2 = "0.11.0"
hmac = "0.13"
typenum = "1.20.1"
constant_time_eq = "0.6.0"

[dev-dependencies]
etherparse = "0.21"
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "blake2s"
harness = false

[[bench]]
name = "chacha20poly1305"
harness = false

[[bench]]
name = "x25519_public_key"
harness = false

[[bench]]
name = "x25519_shared_key"
harness = false

[profile.release]
lto = true        # Enable full link-time optimization.
codegen-units = 1 # Use only 1 codegen-unit to enable full optimizations.

[profile.bench]
lto = true        # Enable full link-time optimization.
codegen-units = 1 # Use only 1 codegen-unit to enable full optimizations.

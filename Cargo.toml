[package]
name = "sanstun"
description = "A fast, sans-IO implementation of the WireGuard® protocol"
version = "0.1.0"
authors = ["Firezone, Inc."]
license = "BSD-3-Clause"
repository = "https://github.com/firezone/sanstun"
edition = "2024"
rust-version = "1.89"

[dependencies]
tracing = "0.1.44"
ring = "0.17"
x25519-dalek = { version = "3.0.0", features = [
    "reusable_secrets",
    "static_secrets",
] }
rand = { version = "0.10", default-features = false, features = ["std_rng"] }
blake2 = "0.11.0"
chacha20 = { version = "0.10", default-features = false, features = ["xchacha"] }
hmac = "0.13"
subtle = "2.6.1"
zeroize = "1.5.6"

[dev-dependencies]
rand = "0.10"
x25519-dalek = { version = "3.0.0", features = ["getrandom"] }
etherparse = "0.21"
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "blake2s"
harness = false

[[bench]]
name = "data_path"
harness = false

[[bench]]
name = "handshake"
harness = false

[[bench]]
name = "chacha20poly1305"
harness = false

[[bench]]
name = "x25519_public_key"
harness = false

[[bench]]
name = "x25519_shared_key"
harness = false

[profile.release]
lto = true
codegen-units = 1

[profile.bench]
lto = true
codegen-units = 1

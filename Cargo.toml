[package]
name = "sanstun"
description = "A fast, sans-IO implementation of the WireGuard® protocol"
version = "0.2.0"
authors = ["Firezone, Inc."]
license = "Apache-2.0"
repository = "https://github.com/firezone/sanstun"
edition = "2024"
rust-version = "1.91"

[features]
default = ["ring"]
ring = ["dep:ring"] # Takes priority if both backends are enabled.
rust-crypto = ["dep:chacha20poly1305"] # Useful for portability as it doesn't depend on a C compiler.

[dependencies]
tracing = "0.1.44"
ring = { version = "0.17", optional = true }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["zeroize"], optional = true }
x25519-dalek = { version = "3.0.0", features = [
    "reusable_secrets",
    "static_secrets",
] }
rand = { version = "0.10", default-features = false, features = ["std_rng"] }
blake2 = "0.11.0"
chacha20 = { version = "0.10", default-features = false, features = ["xchacha"] }
hmac = "0.13"
subtle = "2.6.1"
zeroize = "1.5.6"

[dev-dependencies]
ring = "0.17"
rand = "0.10"
x25519-dalek = { version = "3.0.0", features = ["getrandom"] }
etherparse = "0.21.1"
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "blake2s"
harness = false

[[bench]]
name = "data_path"
harness = false

[[bench]]
name = "handshake"
harness = false

[[bench]]
name = "chacha20poly1305"
harness = false

[[bench]]
name = "x25519_public_key"
harness = false

[[bench]]
name = "x25519_shared_key"
harness = false

[profile.release]
lto = true
codegen-units = 1

[profile.bench]
lto = true
codegen-units = 1

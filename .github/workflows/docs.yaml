name: Documentation

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  RUSTDOCFLAGS: "-D warnings"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo doc --no-deps
      - run: echo '<meta http-equiv="refresh" content="0; url=sanstun/index.html">' > target/doc/index.html
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: target/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1

name: Bootstrap lockfile

on:
  push:
    branches: ["lock-workflow-dependencies"]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock .github/workflows/*.yaml ':!.github/workflows/bootstrap-lockfile.yaml' || gh actions-lock
      - run: git add -A && git diff --cached

name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  crates-io:
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install
      - uses: rust-lang/crates-io-auth-action@v1.0.6
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

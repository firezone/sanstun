name: Bencher

# Runs the image built by `benchmarks.yaml` on Bencher's Bare Metal runners. This workflow has access to
# secrets, so it must never run code from the benchmarked commit, which may come from a fork, and only
# trusts the GitHub API. Bencher runs the image in its own sandbox.
on:
  workflow_run:
    workflows: [Benchmarks]
    types: [completed]

env:
  BENCHER_PROJECT: sanstun
  BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
  BENCHER_SPEC: intel-v1

permissions: {}

jobs:
  track:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # Bencher runs one Bare Metal job at a time, so a run may queue behind others.
    timeout-minutes: 60
    permissions:
      actions: read
      checks: write
      pull-requests: write
    env:
      EVENT: ${{ github.event.workflow_run.event }}
      PR_HEAD: ${{ github.event.workflow_run.head_repository.owner.login }}:${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: benches-image
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: bencherdev/bencher@f80847436d7157936b40525db4c2a1064124f04a # v0.6.13
      - run: |
          image="registry.bencher.dev/$BENCHER_PROJECT:$HEAD_SHA"
          docker load -i benches-image.tar
          docker tag sanstun-benches "$image"
          docker login registry.bencher.dev -u "$BENCHER_PROJECT" --password-stdin <<< "$BENCHER_API_KEY"
          docker push "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - run: |
          if [ "$EVENT" = push ]; then
            args=(
              --branch main
              --threshold-measure latency
              --threshold-test t_test
              --threshold-max-sample-size 64
              --threshold-upper-boundary 0.99
              --thresholds-reset
            )
          else
            pr=$(gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f head="$PR_HEAD" -f base=main --jq '.[0]')
            args=(
              # Prefixing the owner keeps a PR from `main` of a fork from reporting to our `main`.
              --branch "$(jq -r '.head.label | sub(":"; "/")' <<< "$pr")"
              --start-point main
              --start-point-hash "$(jq -r .base.sha <<< "$pr")"
              --start-point-clone-thresholds
              --start-point-reset
              --ci-number "$(jq -r .number <<< "$pr")"
            )
          fi

          bencher run "${args[@]}" \
            --hash "$HEAD_SHA" \
            --testbed "bare-metal-$BENCHER_SPEC" \
            --spec "$BENCHER_SPEC" \
            --image "$IMAGE" \
            --job-timeout 300 \
            --err \
            --adapter rust_criterion \
            --github-actions "$GH_TOKEN"

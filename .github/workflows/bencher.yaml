name: Bencher

# Reports the results of `benchmarks.yaml` to Bencher. This workflow has access to secrets, so it must
# never run code from the benchmarked commit, which may come from a fork, and only trusts the GitHub API.
on:
  workflow_run:
    workflows: [Benchmarks]
    types: [completed]

env:
  BENCHER_PROJECT: sanstun
  BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
  BENCHER_TESTBED: ubuntu-latest

permissions: {}

jobs:
  track:
    if: ${{ !github.event.repository.private && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
      pull-requests: write
    env:
      EVENT: ${{ github.event.workflow_run.event }}
      PR_HEAD: ${{ github.event.workflow_run.head_repository.owner.login }}:${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: criterion
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: bencherdev/bencher@f80847436d7157936b40525db4c2a1064124f04a # v0.6.13
      - run: |
          if [ "$EVENT" = push ]; then
            args=(
              --branch main
              --threshold-measure latency
              --threshold-test t_test
              --threshold-max-sample-size 64
              --threshold-upper-boundary 0.99
              --thresholds-reset
            )
          else
            pr=$(gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f head="$PR_HEAD" -f base=main --jq '.[0]')
            args=(
              # Prefixing the owner keeps a PR from `main` of a fork from reporting to our `main`.
              --branch "$(jq -r '.head.label | sub(":"; "/")' <<< "$pr")"
              --start-point main
              --start-point-hash "$(jq -r .base.sha <<< "$pr")"
              --start-point-clone-thresholds
              --start-point-reset
              --ci-number "$(jq -r .number <<< "$pr")"
            )
          fi

          bencher run "${args[@]}" \
            --hash "$HEAD_SHA" \
            --err \
            --adapter rust_criterion \
            --github-actions "$GH_TOKEN" \
            --file criterion.txt

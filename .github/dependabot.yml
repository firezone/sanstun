version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Actions don't support semver cooldowns. A general cooldown can indefinitely
    # delay updates to actions that release frequently.
    groups:
      security-all:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      semver-patch-days: 2
      semver-minor-days: 7
      semver-major-days: 14
      default-days: 7
    groups:
      security-all:
        applies-to: security-updates
        patterns:
          - "*"
      rust-crypto:
        patterns:
          - blake2
          - chacha20
          - hmac
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # The github-actions ecosystem doesn't support semver cooldowns, and because
    # actions update very frequently, some would never get updated with one.
    groups:
      security-all:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      semver-patch-days: 2
      semver-minor-days: 7
      semver-major-days: 14
      default-days: 7
    groups:
      security-all:
        applies-to: security-updates
        patterns:
          - "*"
      rust-crypto:
        patterns:
          - aead
          - blake2
          - chacha20poly1305
          - hmac
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
